name: Build and Push Image
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Tags are named after the Airflow version (2.11.2-1, 3.3.2-1). Only the
    # Airflow 3 line moves "latest", so tagging the v2 branch never repoints it.
    - name: Get image tags
      id: vars
      run: |
        short_sha=$(echo $GITHUB_SHA | cut -c1-7)
        tags="${{ github.ref_name }} $short_sha"
        case "${{ github.ref_name }}" in
          3.*) tags="latest $tags" ;;
        esac
        echo "tags=$tags" >> $GITHUB_OUTPUT

    - name: Build Image
      id: build-image
      uses: redhat-actions/buildah-build@v2
      with:
        image: fmi-airflow-docker-baseimage
        tags: ${{ steps.vars.outputs.tags }}
        containerfiles: |
          ./Dockerfile

    - name: Push To quay.io
      id: push-to-quay
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: quay.io/fmi
        username: ${{ secrets.IMAGE_REGISTRY_USER }}
        password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}

    - name: Print image url
      run: echo "Image pushed to ${{ steps.push-to-quay.outputs.registry-paths }}"
